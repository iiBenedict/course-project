<div class="container">

  <div class="row justify-content-center mt-5">

    <div class="col-md-5">

      <div class="card shadow">

        <div class="card-body p-4">

          <h2 class="text-center mb-4">
             LibraCore
          </h2>

          <p class="text-center text-muted">
            Library Management System
          </p>

          <form #loginForm="ngForm"
                (ngSubmit)="login(loginForm)">

            <div class="mb-3">

              <label class="form-label">
                Email
              </label>

              <input
                type="email"
                name="email"
                class="form-control"
                ngModel
                required
                email>
            </div>

            <div class="mb-3">
              <label class="form-label">
                Password
              </label>

              <input
                type="password"
                name="password"
                class="form-control"
                ngModel
                required>
            </div>

            @if (errorMessage) {
              <div class="alert alert-danger">
                {{ errorMessage }}
              </div>
            }

            <button
              type="submit"
              class="btn btn-primary w-100">
              Login
            </button>

          </form>
        </div>
      </div>
    </div>
  </div>
</div>
