<div class="auth-shell">

  <div class="auth-card paper-card">

    <div class="p-4 p-md-5">

      <div class="text-center mb-4">
        <div class="page-eyebrow">LibraCore</div>
        <h1 class="page-title mb-2">Welcome back</h1>
        <p class="text-muted mb-0 small">
          Sign in to manage the library.
        </p>
      </div>

      <form #loginForm="ngForm" (ngSubmit)="login(loginForm)">

        <div class="mb-3">
          <label class="form-label">Email</label>
          <input
            type="email"
            name="email"
            class="form-control"
            placeholder="you@example.com"
            ngModel
            required
            email>
        </div>

        <div class="mb-3">
          <label class="form-label">Password</label>
          <input
            type="password"
            name="password"
            class="form-control"
            placeholder="Your password"
            ngModel
            required>
        </div>

        @if (errorMessage) {
          <div class="alert alert-danger py-2 small">
            {{ errorMessage }}
          </div>
        }

        <button
          type="submit"
          class="btn btn-primary w-100"
          [disabled]="submitting">
          @if (submitting) {
            <span class="spinner-border spinner-border-sm me-2"></span>
          }
          Sign in
        </button>

      </form>

      <div class="text-center mt-4 small text-muted">
        No account yet?
        <a routerLink="/register" class="fw-semibold">Create one</a>
      </div>

      <div class="auth-hint text-center mt-4 small">
        <span class="text-muted">Demo:</span>
        <code>admin&#64;library.local</code>
        <span class="text-muted">/</span>
        <code>admin123</code>
      </div>

    </div>

  </div>

</div>
